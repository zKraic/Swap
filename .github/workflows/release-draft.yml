name: verify-release-candidate
# Checks a tested build and prepares its provenance. It never creates a release: the maintainer publishes
# from their own account after the exact executable passed isolated Windows validation.
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful build-and-test run to verify
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-candidate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate provenance of the tested CI artifact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:BUILD_RUN -notmatch '^\d+$'){throw 'Invalid build run ID'}
          $run=gh api "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $run.name -ne 'build-and-test' -or $run.conclusion -ne 'success' -or $run.event -ne 'push' -or $run.head_branch -ne 'main' -or $run.head_repository.full_name -ne $env:GH_REPO){throw 'Expected a successful main-branch build in this repository'}
          gh run download $env:BUILD_RUN --name Swap-win-x64 --dir release-input
          if($LASTEXITCODE -ne 0){throw 'Artifact download failed'}
          $exe=Get-Item release-input/dist/Swap.exe
          $report=Get-Content release-input/artifacts/test-results.json -Raw | ConvertFrom-Json
          if($report.failed -ne 0 -or $report.passed -lt 201){throw 'Unexpected test report'}
          $hash=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $expected=(Get-Content release-input/dist/Swap.exe.sha256 -Raw).Trim().Split(' ')[0]
          if($hash -ne $expected){throw 'Artifact checksum mismatch'}
          $version=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName).ProductVersion.Split('+')[0]
          $project=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if($version -ne $project){throw "Unexpected version $version (project $project)"}
          @{author='KraicDev';version=$version;appSha256=$hash;bytes=$exe.Length;sourceCommit=$run.head_sha;buildRun=$run.html_url;ciCorePassed=$report.passed;unsigned=$true} | ConvertTo-Json -Depth 4 | Set-Content release-input/build-provenance.json -Encoding utf8
          Write-Output "Verified $version $hash from $($run.head_sha). Publish it from the maintainer account after isolated validation."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: |
            release-input/dist/Swap.exe
            release-input/dist/Swap.exe.sha256
            release-input/build-provenance.json
